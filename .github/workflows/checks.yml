name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Run every Python test without provider access
        working-directory: plugins/travel-planning
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import socket
          import sys
          import tempfile
          import unittest
          from unittest.mock import patch

          def offline(*args, **kwargs):
              raise AssertionError('Unit tests must mock network access')

          with tempfile.TemporaryDirectory() as directory:
              config = Path(directory) / 'sources.local.env'
              config.write_text('', encoding='utf-8')
              os.environ['TRAVEL_SOURCES_CONFIG'] = str(config)
              os.environ['XDG_CONFIG_HOME'] = directory
              for key in ('AMAP_API_KEY', 'AMAP_MAPS_API_KEY', 'FLYAI_API_KEY',
                          'FLYAI_PROFILE', 'FLYAI_SIGN_SECRET', 'VARIFLIGHT_API_KEY'):
                  os.environ.pop(key, None)
              with patch.object(socket.socket, 'connect', offline), patch.object(socket.socket, 'connect_ex', offline):
                  suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
                  result = unittest.TextTestRunner(verbosity=2).run(suite)
              sys.exit(not result.wasSuccessful() or bool(result.skipped) or result.testsRun == 0)
          PY

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/travel-planning/web/package-lock.json
      - name: Install locked frontend tools
        working-directory: plugins/travel-planning/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild and verify tracked frontend assets
        working-directory: plugins/travel-planning/web
        run: |
          npm run build
          git diff --exit-code -- ../skills/travel-planning/assets/frontend

  package:
    name: Marketplace package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Build and validate the installable ZIP
        run: |
          python scripts/package_plugin.py --output output/ci-marketplace.zip
          python - <<'PY'
          import json
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          prefix = 'travel-planning-marketplace/'
          plugin = prefix + 'plugins/travel-planning/'
          with ZipFile('output/ci-marketplace.zip') as archive:
              assert archive.testzip() is None, 'Archive CRC check failed'
              names = archive.namelist()
              assert names and len(names) == len(set(names)), 'Empty or duplicate archive entries'
              for name in names:
                  path = PurePosixPath(name)
                  assert name.startswith(prefix) and '..' not in path.parts, 'Unsafe archive path'
                  assert not set(path.parts).intersection({'.git', 'node_modules', '__pycache__', '.travel-tools', '.travel-research'}), 'Runtime data in package'
                  assert path.name != 'sources.local.env', 'Local provider configuration in package'
              marketplace = json.loads(archive.read(prefix + '.agents/plugins/marketplace.json'))
              manifest = json.loads(archive.read(plugin + '.codex-plugin/plugin.json'))
              assert manifest['name'] == 'travel-planning'
              assert any(item['name'] == manifest['name'] and item['source']['path'] == './plugins/travel-planning' for item in marketplace['plugins'])
              assert plugin + manifest['mcpServers'].removeprefix('./') in names
              assert any(name.startswith(plugin + manifest['skills'].removeprefix('./')) and name.endswith('/SKILL.md') for name in names)
          print('Marketplace ZIP, manifests, resources and package paths validated.')
          PY
